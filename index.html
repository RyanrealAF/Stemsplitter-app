<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stemsplitter Client</title>
<style>
:root{--bg:#0d0d10;--card:#17171c;--line:#2a2a33;--fg:#ececf1;--dim:#8b8b99;--acc:#ff4d4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:18px;max-width:760px;margin:auto}
h1{font-size:22px;margin:6px 0 2px}
p.sub{color:var(--dim);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
#drop{border:2px dashed var(--line);border-radius:12px;padding:28px 12px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s}
#drop.over,#drop:hover{border-color:var(--acc);color:var(--fg)}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:600 15px system-ui;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;background:#0d0d10;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px}
#status{font-weight:600}
#bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px;display:none}
#bar i{display:block;height:100%;width:30%;background:var(--acc);animation:slide 1.2s infinite ease-in-out}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
.file{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.file b{display:block;word-break:break-all;margin-bottom:6px}
audio{width:100%}
a{color:#7db7ff}
pre{background:#0d0d10;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:340px;font-size:12px;white-space:pre-wrap;word-break:break-word}
details summary{cursor:pointer;color:var(--dim)}
.err{color:#ff8080}
<style>
#lyricStage{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#09090b;padding:24px}
.lyric-line{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;font-size:clamp(28px,7vw,62px);font-weight:800;letter-spacing:-.025em;opacity:0;transform:translateY(16px) scale(.96);transition:opacity .08s linear,transform .18s cubic-bezier(.2,.8,.2,1);text-wrap:balance}
.lyric-line.active{opacity:1;transform:none}.lyric-line.intro{font-size:clamp(22px,5vw,42px);font-weight:600}.lyric-line.laugh{transform:scale(.9) rotate(-1deg)}.lyric-line.laugh.active{transform:scale(1.04)}.lyric-line.hit{font-size:clamp(42px,11vw,92px);text-transform:uppercase}.lyric-line.chant{font-size:clamp(30px,8vw,68px);text-transform:uppercase}.lyric-line.chorus{font-size:clamp(34px,9vw,78px)}.lyric-line .em{color:var(--acc);text-shadow:0 0 22px rgba(255,77,77,.25)}
@media(prefers-reduced-motion:reduce){.lyric-line{transition:none}}
</style></head>
<body>
<h1>Stemsplitter Client</h1>
<p class="sub">Upload a track, send it to your Hugging Face Space, get stems and analysis back.</p>

<div class="card">
  <div id="drop">Tap or drop an audio file here<input id="file" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.ogg" hidden></div>
  <div id="picked" class="sub" style="margin-top:10px"></div>
  <div class="row">
    <button id="go" disabled>Process</button>
    <button id="cancel" class="ghost" disabled>Cancel</button>
    <span id="status"></span>
  </div>
  <div id="bar"><i></i></div>
</div>

<div class="card">
  <details>
    <summary>Settings</summary>
    <label>Space URL</label>
    <input id="base" type="text" value="https://ryanrealaf-stemsplitter.hf.space">
    <label>API name</label>
    <input id="api" type="text" value="process_sync">
    <label>Hugging Face token (optional, stored only in this browser)</label>
    <input id="token" type="password" placeholder="hf_...">
  </details>
</div>

<div id="performance" class="card" style="display:none">
  <div class="row" style="margin:0 0 6px"><b>Dynamic lyric performance</b><button id="perfPlay" class="ghost">Play performance</button></div>
  <div id="perfMeta" class="sub"></div>
  <div id="lyricStage" aria-live="polite"></div>
  <audio id="perfAudio" controls preload="metadata" style="width:100%;margin-top:12px"></audio>
</div>

<div id="results" class="card" style="display:none">
  <div class="row" style="margin:0 0 6px"><b>Results</b>
    <button id="dl" class="ghost">Download results.json</button></div>
  <div id="out"></div>
  <details style="margin-top:12px"><summary>Raw response</summary><pre id="raw"></pre></details>
</div>

<div class="card"><details><summary>Event log</summary><pre id="log"></pre></details></div>

<script>
const $ = id => document.getElementById(id);
let file = null, ctrl = null, lastResult = null, timer = null;

// ---------- UI wiring ----------
$('drop').onclick = () => $('file').click();
$('file').onchange = e => pick(e.target.files[0]);
['dragover','dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => pick(e.dataTransfer.files[0]));
$('token').value = localStorage.getItem('hf_token') || '';
$('token').onchange = () => localStorage.setItem('hf_token', $('token').value.trim());

function pick(f) {
  if (!f) return;
  file = f;
  $('picked').textContent = `${f.name} · ${(f.size / 1048576).toFixed(1)} MB`;
  $('go').disabled = false;
}
const log = m => { $('log').textContent += `[${new Date().toLocaleTimeString()}] ${m}\n`; };
function setStatus(m, err) { $('status').textContent = m; $('status').className = err ? 'err' : ''; }
function busy(b) {
  $('go').disabled = b || !file; $('cancel').disabled = !b;
  $('bar').style.display = b ? 'block' : 'none';
}

// ---------- Gradio REST helpers ----------
const baseUrl = () => $('base').value.trim().replace(/\/+$/, '');
const authHeaders = () => { const t = $('token').value.trim(); return t ? { Authorization: 'Bearer ' + t } : {}; };

async function uploadFile(f, signal) {
  for (const path of ['/gradio_api/upload', '/upload']) {
    const fd = new FormData(); fd.append('files', f, f.name);
    const r = await fetch(baseUrl() + path, { method: 'POST', body: fd, headers: authHeaders(), signal });
    if (r.status === 404) continue;
    if (!r.ok) throw new Error(`Upload failed (${r.status}): ${await r.text()}`);
    const j = await r.json();
    return { path: j[0], orig_name: f.name, size: f.size, meta: { _type: 'gradio.FileData' } };
  }
  throw new Error('Upload endpoint not found on this Space');
}

// POST /gradio_api/call/<api>  ->  event_id, then stream GET /gradio_api/call/<api>/<event_id>
async function callApi(api, data, signal) {
  const start = await fetch(`${baseUrl()}/gradio_api/call/${api}`, {
    method: 'POST', signal,
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ data })
  });
  if (!start.ok) throw new Error(`Call failed (${start.status}): ${await start.text()}`);
  const { event_id } = await start.json();
  log('event_id ' + event_id);

  const res = await fetch(`${baseUrl()}/gradio_api/call/${api}/${event_id}`, { headers: authHeaders(), signal });
  if (!res.ok || !res.body) throw new Error(`Stream failed (${res.status})`);

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      let ev = 'message', d = [];
      for (const line of block.split('\n')) {
        if (line.startsWith('event:')) ev = line.slice(6).trim();
        else if (line.startsWith('data:')) d.push(line.slice(5).trimStart());
      }
      const payload = d.join('\n');
      log(`${ev}: ${payload.slice(0, 160)}`);
      if (ev === 'complete') return JSON.parse(payload);
      if (ev === 'error') throw new Error(payload && payload !== 'null' ? payload : 'The Space returned an error (check its logs)');
    }
  }
  throw new Error('Stream ended without a result');
}

// ---------- Run ----------
$('go').onclick = async () => {
  if (!file) return;
  ctrl = new AbortController();
  $('results').style.display = 'none'; $('log').textContent = '';
  busy(true);
  const t0 = Date.now();
  timer = setInterval(() => setStatus(`Working… ${Math.floor((Date.now() - t0) / 1000)}s`), 500);
  try {
    setStatus('Uploading…');
    const fd = await uploadFile(file, ctrl.signal);
    log('uploaded ' + fd.path);
    clearInterval(timer);
    timer = setInterval(() => setStatus(`Processing… ${Math.floor((Date.now() - t0) / 1000)}s`), 500);
    const out = await callApi($('api').value.trim() || 'process_sync', [fd], ctrl.signal);
    clearInterval(timer);
    setStatus(`Done in ${Math.round((Date.now() - t0) / 1000)}s`);
    show(out);\n    renderPerformance(out);
  } catch (e) {
    clearInterval(timer);
    setStatus(e.name === 'AbortError' ? 'Cancelled' : e.message, e.name !== 'AbortError');
    log('ERROR ' + e.message);
  } finally { busy(false); }
};
$('cancel').onclick = () => ctrl && ctrl.abort();


// ---------- Dynamic lyric performance ----------
let performance=null;
function asObject(v){if(!v)return null;if(typeof v==='object')return v;if(typeof v==='string'){try{return JSON.parse(v)}catch{return null}}return null}
function normalizeTimeline(root){
 const o=asObject(root);if(!o)return null;
 const a=o.analysis||o.audio_analysis||o;
 const ys=o.lyrics||o.lyric_timeline||o.timeline||o.events;
 if(!Array.isArray(ys)||!ys.length)return null;
 const lines=ys.map((x,i)=>{
  if(typeof x==='string')return {line:x,start_ms:i*2000,end_ms:(i+1)*2000,mood:'verse'};
  const s=Number(x.start_ms??x.start??x.timestamp_ms??x.time_ms??0);
  const e=Number(x.end_ms??x.end??(s+Number(x.duration_ms||1800)));
  return {line:String(x.line??x.text??x.lyric??''),start_ms:Number.isFinite(s)?s:0,end_ms:Number.isFinite(e)?e:s+1800,mood:String(x.mood||'verse'),emphasis:x.emphasis||''};
 }).filter(x=>x.line.trim()).sort((x,y)=>x.start_ms-y.start_ms);
 const beats=Array.isArray(a.beats_ms)?a.beats_ms.map(Number).filter(Number.isFinite):[];
 const bpm=Number(a.bpm_measured_from_beats??a.bpm_detected??a.bpm);
 return {analysis:a,lines,beats,bpm:Number.isFinite(bpm)?bpm:null};
}
function extractPerformance(outputs){
 const found=[];
 function walk(v){
  if(!v)return;
  if(Array.isArray(v))return v.forEach(walk);
  if(typeof v==='object'){found.push(v);Object.values(v).forEach(walk)}
  else if(typeof v==='string'&&/^[\[{]/.test(v.trim())){try{walk(JSON.parse(v))}catch{}}
 }
 walk(outputs);
 return found.map(normalizeTimeline).find(Boolean)||null;
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderPerformance(outputs){
 const p=extractPerformance(outputs);if(!p)return;
 performance=p;const stage=$('lyricStage');stage.innerHTML='';
 p.lines.forEach((l,i)=>{const e=document.createElement('div');e.className='lyric-line '+(l.mood||'verse');e.dataset.index=i;e.textContent=l.line;stage.appendChild(e)});
 $('perfMeta').textContent=[p.bpm?p.bpm.toFixed(2)+' BPM':null,p.beats.length?p.beats.length+' detected beats':null,Number(p.analysis.duration)?Number(p.analysis.duration).toFixed(2)+' sec':null,p.lines.length+' lyric events'].filter(Boolean).join(' · ');
 $('performance').style.display='block';const af=findFirstAudio(outputs);if(af)$('perfAudio').src=fileUrl(af);runPerformance();
}
function findFirstAudio(v){
 if(!v)return null;if(Array.isArray(v)){for(const x of v){const r=findFirstAudio(x);if(r)return r}return null}
 if(isFileData(v)){const n=String(v.orig_name||v.path||v.url||'');if(AUDIO.test(n))return v}
 if(typeof v==='object'){for(const x of Object.values(v)){const r=findFirstAudio(x);if(r)return r}}return null
}
function runPerformance(){
 if(!performance)return;const audio=$('perfAudio'),lines=[...document.querySelectorAll('.lyric-line')];
 const clock=()=>{const t=audio.currentTime*1000;let active=-1;for(let i=0;i<performance.lines.length;i++){const l=performance.lines[i];if(t>=l.start_ms&&t<l.end_ms){active=i;break}}lines.forEach((e,i)=>e.classList.toggle('active',i===active))};
 audio.ontimeupdate=clock;audio.onseeked=clock;audio.onplay=clock;clock();
 $('perfPlay').onclick=()=>audio.paused?audio.play():audio.pause();
}
\n// ---------- Render whatever comes back ----------
const AUDIO = /\.(mp3|wav|flac|ogg|m4a|aac)(\?|$)/i;
const fileUrl = f => f.url || `${baseUrl()}/gradio_api/file=${f.path}`;
const isFileData = v => v && typeof v === 'object' && (v.url || v.path) && (!v.meta || v.meta._type === 'gradio.FileData');

function show(outputs) {
  lastResult = outputs;
  $('raw').textContent = JSON.stringify(outputs, null, 2);
  const out = $('out'); out.innerHTML = '';
  const walk = (v, label) => {
    if (v == null) return;
    if (Array.isArray(v)) { v.forEach((x, i) => walk(x, label ? `${label}[${i}]` : `output ${i}`)); return; }
    if (isFileData(v)) { out.appendChild(fileCard(v, label)); return; }
    if (typeof v === 'string') {
      const s = v.trim();
      if (/^https?:\/\//.test(s)) { out.appendChild(fileCard({ url: s, orig_name: label }, label)); return; }
      if (/^[\[{]/.test(s)) { try { v = JSON.parse(s); } catch { } }
    }
    const box = document.createElement('div'); box.className = 'file';
    box.innerHTML = `<b></b><pre></pre>`;
    box.querySelector('b').textContent = label || 'result';
    box.querySelector('pre').textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    out.appendChild(box);
  };
  walk(outputs, '');
  $('results').style.display = 'block';
}

function fileCard(f, label) {
  const url = fileUrl(f), name = f.orig_name || (f.path || url).split('/').pop() || label;
  const d = document.createElement('div'); d.className = 'file';
  const b = document.createElement('b'); b.textContent = name; d.appendChild(b);
  if (AUDIO.test(name) || AUDIO.test(url)) {
    const a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = url; d.appendChild(a);
  }
  const l = document.createElement('a'); l.href = url; l.target = '_blank'; l.rel = 'noopener'; l.download = name;
  l.textContent = 'Download'; l.style.display = 'inline-block'; l.style.marginTop = '8px'; d.appendChild(l);
  return d;
}

$('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(lastResult, null, 2)], { type: 'application/json' }));
  a.download = 'results.json'; a.click();
};
</script>
</body></html>
